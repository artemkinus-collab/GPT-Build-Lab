name: Build Web Artifact

on:
  workflow_dispatch:
    inputs:
      project_repository:
        description: Public GitHub repository (owner/repository)
        required: true
        type: string
      project_ref:
        description: Branch, tag, or commit to package
        required: true
        default: main
        type: string
      project_path:
        description: Folder containing index.html (use . for repository root)
        required: true
        default: .
        type: string
      build_id:
        description: Internal Build Lab build ID (leave empty for manual runs)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: web-build-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  package:
    name: Validate and package static website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Build Lab tools
        uses: actions/checkout@v4
        with:
          path: build-lab

      - name: Check out public project source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.project_repository }}
          ref: ${{ inputs.project_ref }}
          path: project-source
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository input
        env:
          PROJECT_REPOSITORY: ${{ inputs.project_repository }}
          PROJECT_REF: ${{ inputs.project_ref }}
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          python - <<'PY'
          import os, re
          repo = os.environ["PROJECT_REPOSITORY"]
          ref = os.environ["PROJECT_REF"]
          path = os.environ["PROJECT_PATH"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repo):
              raise SystemExit("Repository must use owner/repository format.")
          if not ref or len(ref) > 200 or ref.startswith("-") or ".." in ref:
              raise SystemExit("Invalid branch, tag, or commit reference.")
          if not path or path.startswith("/") or "\\" in path or ".." in path.split("/"):
              raise SystemExit("Project path must be a safe relative directory.")
          PY

      - name: Package static website
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          python build-lab/scripts/package_web.py \
            --source project-source \
            --project-path "$PROJECT_PATH" \
            --output build-output/web-project.zip

      - name: Upload downloadable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gpt-build-lab-web-${{ github.run_number }}
          path: build-output/web-project.zip
          if-no-files-found: error
          retention-days: 7

      - name: Write build summary
        env:
          PROJECT_REPOSITORY: ${{ inputs.project_repository }}
          PROJECT_REF: ${{ inputs.project_ref }}
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          {
            echo "## Web package ready"
            echo ""
            echo "- Repository: `$PROJECT_REPOSITORY`"
            echo "- Ref: `$PROJECT_REF`"
            echo "- Project folder: `$PROJECT_PATH`"
            echo "- Artifact: `gpt-build-lab-web-${{ github.run_number }}`"
            echo "- Retention: 7 days"
            echo ""
            echo "This workflow packages static files only. It does not execute project scripts."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report build result to GPT Build Lab
        if: always() && inputs.build_id != '' && vars.SUPABASE_FUNCTIONS_URL != ''
        env:
          BUILD_ID: ${{ inputs.build_id }}
          BUILD_STATUS: ${{ job.status }}
          CALLBACK_URL: ${{ vars.SUPABASE_FUNCTIONS_URL }}/build-callback
          CALLBACK_SECRET: ${{ secrets.BUILD_CALLBACK_SECRET }}
          ARTIFACT_NAME: gpt-build-lab-web-${{ github.run_number }}
          WORKFLOW_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "x-build-callback-secret: $CALLBACK_SECRET" \
            -d "$(python -c 'import json,os; print(json.dumps({"build_id":os.environ["BUILD_ID"],"status":"completed" if os.environ["BUILD_STATUS"]=="success" else "failed","artifact_name":os.environ["ARTIFACT_NAME"],"workflow_url":os.environ["WORKFLOW_URL"]}))')"
