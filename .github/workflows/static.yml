# Deploy only the public web dashboard to GitHub Pages.
name: Deploy GPT Build Lab

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    name: Package website
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Publish website
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
